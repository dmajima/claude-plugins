# convert-doc プラグインの Python スクリプト向け ruff 設定
#
# 既存スクリプト（convert_from_pptx.py / verify_md.py）の現実的な制約に合わせた設定。
# 完全な PEP 8 遵守よりも、可読性と既存コードベース整合を優先する。

line-length = 120

[lint]
# 標準的な品質チェック (E=pycodestyle, F=pyflakes, W=warning, B=bugbear, UP=pyupgrade)
select = ["E", "F", "W", "B", "UP"]

# 既存コード由来で許容するスタイル系:
# - E501: line-too-long (line-length=120 でも残るケースは長い print 文等)
# - N806: non-lowercase-variable-in-function (既存定数命名 MAX_SLIDES 等が関数内に
#   引用される箇所、および lxml ライブラリの慣習に合わせた一部の名前)
ignore = [
    "N806",
]

# UP006 / UP045 等の Python 3.10+ アップグレード推奨は、Python 3.9 サポートを
# 維持する間は警告レベルで残す（fix 適用済み箇所のみ近代化済み）.

[format]
# 既存コードのインデント・改行を尊重。format 適用は本設定では行わない.
quote-style = "double"
indent-style = "space"
